<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Home</title>
    <!--link del CSS de Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--link de la biblioteca de iconos de Boostrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--link del CSS-->
    <link rel="stylesheet" href="styles.css">
</head>
    
    <!-- 
    Flujo de trabajo por cada modulo:
    1) HTML
    2) JS
    3) CSS

    Responsive para este proyecto:
    Hasta sm(575px) es mobil

    1. Menu de navegación:
    El menú de navegación debe colapsar en un menú tipo hamburguesa únicamente
    en la versión móvil. En escritorio debe mostrarse de forma expandida. 
    -->
<body>
    <header>
        <div id="navbar-placeholder">

        </div>

        <h1>Pokemon Web</h1>
    </header>

    <main>
        <section id="hero-img">
            <img src="img/hero.jpg.webp" alt="hero de pokemon" class="img-fluid">
        </section>

        <section id="sobre-la-web">
            <!-- Explicar que funciones provee la web (recomendación dejar para el final) -->
            <h2>Sobre la web</h2>
            <p>Explicar que funciones provee la web (recomendación dejar para el final) </p>
        </section>
    </main>

    <!--script del JS de Boostrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        fetch('componentes-html-globales/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById("navbar-placeholder").innerHTML = data;
            });
        /*
        Fetch puede traer cualquier elemento alojado en la web incluyendo las propias paginas .html
        Este elemento esta alojado en l
        */
    </script>
</body>
</html>
